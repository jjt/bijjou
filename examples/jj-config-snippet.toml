# bijjou works out of the box with jj's default log output: it detects the
# native `(empty)` and `(divergent)` annotations by their literal text and
# locates the graph column by Unicode codepoint, not by ANSI. No jj-side
# configuration is required.
#
# `ui.color = "always"` is optional. Set it if you want jj's color choices
# preserved when piping into bijjou (jj otherwise drops color when stdout
# isn't a tty).

[ui]
color = "always"
