# Add this minimal config to jj config and then pipe jj through bijjou
#
# A single 𝘽 anywhere in stdin is enough to opt bijjou into processing the
# whole stream; without it bijjou passes input through unchanged.

[ui]
color = "always"

[template-aliases]
# bijjou uses characters from the Math Bold Italic set to tell if the commit
# is empty and/or immutable, and to activate bijjou. These characters are
# removed from the final output.
#  𝘽 (U+1D63D) - activate bijjou         (override via `activation_marker`)
#  𝙀 (U+1D640) - commit is empty         (override via `commits.markers.empty`)
#  𝙄 (U+1D644) - commit is immutable     (override via `commits.markers.immutable`)
# If you change any of these in bijjou's config, mirror the change in the
# string literals below so the template emits the matching bytes.
'format_bijjou_markers(commit)' = '''
separate("",
  "𝘽",
  if(commit.empty(), label("empty", "𝙀")),
  if(commit.immutable(), label("immutable", "𝙄")),
)
'''

[templates]
log = 'format_bijjou_markers(self) ++ builtin_log_oneline(self)'
