# Example bijjou config.
#
# Path resolution:
#   1. $BIJJOU_CONFIG, if set
#   2. $XDG_CONFIG_HOME/bijjou/config.toml
#   3. $HOME/.config/bijjou/config.toml
#
# Every key is optional. Omitted keys keep their built-in default.
# Sections may be omitted entirely. Comments must start in column 0
# (inline `# ...` after a value is not supported).
#
# Overrides (low → high precedence): config file < env vars < CLI flags.
#   Env: prefix `BIJJOU__`, replace `.` with `__`.
#     e.g. `graph.nodes.chars.working-copy` → `BIJJOU__graph__nodes__chars__working-copy`
#   CLI: `--<key>=<value>`, replace `.` with `__`.
#     e.g. `--graph__nodes__chars__working-copy=X`
#   `--activate` with no value is shorthand for `--activate=auto`.

# Processing mode: one of "auto", "always", "never".
#   auto   — gate on `activation-marker`.
#   always — process every line regardless of marker presence (default).
#   never  — passthrough stdin byte-for-byte without processing.
# The `--activate=<auto|always|never>` CLI flag overrides this; `--activate`
# with no value resolves to "auto".
#
# Default: "always"
#
# activate = "always"

# Opt-in marker. In `auto` mode, bijjou processes input only if this byte
# sequence appears at least once anywhere in stdin. All occurrences are
# stripped from output. When absent (and mode is auto), stdin is passed
# through byte-for-byte. Must be a non-empty string of printable characters;
# empty or control-char markers are a configuration error. To always process
# regardless of input, set `activate = "always"` instead.
#
# Default: "BIJJOU_ACTIVATE"
# Pair with a jj template that emits the marker — see
# examples/jj-config-snippet.toml.
#
activation-marker = "BIJJOU_ACTIVATE"

# Pager mode: one of "auto", "always", "never".
#   auto   — page only when $PAGER is set and stdout is a terminal (default).
#   always — always page; bijjou errors at startup if $PAGER is unset.
#   never  — never page; output goes straight to stdout.
#
# Default: "auto"
#
# pager = "auto"

[commits.markers]
# Sentinel strings bijjou looks for to detect commit state. The defaults
# match jj's native log annotations — no jj template config required.
# Both are stripped from output. Set either to "" to disable detection of
# that state.
#
# Defaults: empty = "(empty)", divergent = "(divergent)"
#
# empty     = "(empty)"
# divergent = "(divergent)"

[graph.nodes.chars]
# Replacement glyphs for the commit-node chars jj prints (@ ○ ◆ × ●).
# Many defaults are Nerd Font codepoints.
#
# working-copy       = "󰋘"
# mutable            = ""
# immutable          = ""
# conflict           = ""
# alternate          = ""
# empty              = ""
# working-copy-empty = ""
# empty-immutable    = ""

[graph.edges.chars]
# Single-cell replacements for jj's box-drawing graph chars. Defaults are
# Unicode 16 Large Type Pieces (U+1CE1A..U+1CE50): 𜸟 𜸩 𜸚 𜸤 𜸾 𜹃 𜸨 𜸶 𜸠 𜹀 𜸺.
#
# horizontal   = "𜸟"
# vertical     = "𜸩"
# top-left     = "𜸚"
# top-right    = "𜸤"
# bottom-left  = "𜸾"
# bottom-right = "𜹃"
# tee-right    = "𜸨"
# tee-left     = "𜸶"
# tee-down     = "𜸠"
# tee-up       = "𜹀"
# cross        = "𜸺"
# elision      = "𜹀"

[filter]
# Drop lines whose visible content is nothing but vertical graph edges (│) —
# the filler rows jj prints between commit nodes. Spaces, CSI escapes, and
# bijjou's own markers are ignored when judging "vertical-only".
#
# Default: false
#
# hide-vertical-only-lines = true

[layout]
# Controls horizontal layout between the graph column and commit content.
#
# `align` — when true (default), every line's content column is shifted to
# the right of the widest graph column seen in the input, so all change ids
# line up vertically. Narrow rows get dash filler to bridge the gap. When
# false, each line uses only its own graph width plus `gap`, so content
# starts immediately after its local graph column with no filler.
#
# `gap` — number of spaces between the rightmost graph column and the start
# of commit content. 0 lets content touch the graph node.
#
# `dash` — glyph repeated to fill the gap between the graph and commit
# content, and to fill every internal space run between graph chars on a
# row once that row's node has appeared. Spaces to the left of the node,
# or before any graph char on edge-only rows, are left alone.
#
# `dash-arrow` — if non-empty, replaces the rightmost dash in the
# trailing run with this glyph to point at the content; leave empty for
# a plain dash run.
#
# `dash-margin` — number of plain spaces kept between the trailing dash
# run and the adjacent graph char or commit content. A trailing gap is
# dash-filled only when it is at least `2 * dash-margin + 1` cells wide.
# Internal runs between graph chars always fill one dash per space and
# ignore this margin.
#
# `dash-start` / `dash-end` — terminal glyphs that replace the first and
# last dash of a run when `dash-margin = 0`, so the fill butts up against
# the graph node and commit info with a half-line cap. `dash-start`
# applies when the run sits immediately to the right of a node char;
# `dash-end` applies to the last dash before the commit content. Set
# either to an empty string to disable that cap. `dash-arrow` takes
# precedence over `dash-end`.
#
# Defaults: align = true, gap = 2, dash = "─", dash-arrow = "" (no arrow),
# dash-margin = 1, dash-start = "╶", dash-end = "╴"
#
# align       = true
# gap         = 2
# dash        = "─"
# dash-arrow  = "▶"
# dash-margin = 1
# dash-start  = "╶"
# dash-end    = "╴"

[colors]
# Either an integer 0-255 (256-color palette) or a "#rrggbb" hex string.
# Defaults: dash-filler = 8, edge = 240, mutable-node = 245.
#
# dash-filler — color of the dash filler between graph and content.
# edge        — color of graph edges (lines, corners, tees, crosses).
# mutable-node — color applied to ○, ◆, and the immutable @ glyph.
#
# dash-filler  = 8
# edge         = "#5f5f5f"
# mutable-node = 245

[stream]
# Streaming mode flushes rendered output as input arrives, in batches of
# `batch-size` lines. The graph-column width is tracked across the whole
# stream and grows monotonically the moment a wider graph column appears
# (not at the batch boundary), so column alignment never shifts backwards.
# `batch-size` controls flush cadence: smaller batches give lower latency to
# first paint, larger batches reduce syscalls. When stdout is a terminal and
# $PAGER is set, batches are flushed into the pager (the pager must tolerate
# partial input — modern `less` does).
#
# Note: streaming and non-streaming intentionally differ here. Non-streaming
# has the whole input up front and aligns every line to the global max
# graph_col, so early narrow rows get dash filler that extends to the widest
# point of the log. Streaming can't see the future, so early narrow rows stay
# narrow and the alignment steps right at the first row that widens. Same
# input → different output between the two modes for any log that fans out
# after the first row.
#
# When `activate = "auto"` and streaming is on, the activation-marker scan is
# limited to the first batch. If the marker isn't there, the rest of stdin is
# passed through byte-for-byte without further processing. Set
# `activate = "always"` to skip the scan entirely.
#
# Defaults: enabled = true, batch-size = 128
#
# enabled    = true
# batch-size = 128
