activate = "always"

[graph.nodes.chars]
working-copy = "@"
mutable = "o"
immutable = "#"
conflict = "x"
hidden = "*"
fallback = "o"
empty = "."
working-copy-empty = "_"
empty-immutable = ":"

[graph.edges.chars]
horizontal = "-"
vertical = "|"
top-left = "/"
top-right = "\\"
bottom-left = "\\"
bottom-right = "/"
tee-right = "+"
tee-left = "+"
tee-down = "+"
tee-up = "+"
cross = "+"
elision = "~"

[layout]
dash = "."

[colors]
dash-filler = 244
edge = 245

[stream]
enabled = false
