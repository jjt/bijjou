# Example bijjou config.
#
# Path resolution:
#   1. $BIJJOU_CONFIG, if set
#   2. $XDG_CONFIG_HOME/bijjou/config.toml
#   3. $HOME/.config/bijjou/config.toml
#
# Every key is optional. Omitted keys keep their built-in default.
# Sections may be omitted entirely. Comments must start in column 0
# (inline `# ...` after a value is not supported).
#
# Overrides (low → high precedence): config file < env vars < CLI flags.
#   Env: prefix `BIJJOU__`, replace `.` with `__` and `-` with `_`.
#     Uppercase is canonical; lowercase also accepted.
#     e.g. `graph.edges.chars.horizontal` → `BIJJOU__GRAPH__EDGES__CHARS__HORIZONTAL`
#   CLI: `--<key>=<value>`, replace `.` with `__`.
#     e.g. `--graph__edges__chars__horizontal=X`
#   `--activate` with no value is shorthand for `--activate=auto`.

# Processing mode: one of "auto", "always", "never".
#   auto   — gate on `activation-marker`.
#   always — process every line regardless of marker presence (default).
#   never  — passthrough stdin byte-for-byte without processing.
# The `--activate=<auto|always|never>` CLI flag overrides this; `--activate`
# with no value resolves to "auto".
#
# Default: "always"
#
# activate = "always"

# Opt-in marker. In `auto` mode, bijjou processes input only if this byte
# sequence appears at least once anywhere in stdin. When absent (and mode
# is auto), stdin is passed through byte-for-byte. Must be a non-empty
# string of printable characters; empty or control-char markers are a
# configuration error. To always process regardless of input, set
# `activate = "always"` instead.
#
# Default: "BIJJOU_ACTIVATE"
# Pair with a jj template that emits the marker — see
# examples/jj-config-snippet.toml.
#
# activation-marker = "BIJJOU_ACTIVATE"

# Pager mode: one of "auto", "always", "never".
#   auto   — page only when $PAGER is set and stdout is a terminal (default).
#   always — always page; bijjou errors at startup if $PAGER is unset.
#   never  — never page; output goes straight to stdout.
#
# Default: "auto"
#
# pager = "auto"

[ui]
# Color output: one of "auto", "always", "never".
#   auto   — emit color when stdout is a terminal; strip otherwise (default).
#   always — always emit color sequences.
#   never  — strip every SGR sequence from the output.
# The `--color=<auto|always|never>` CLI flag overrides this; `--color` with no
# value resolves to "auto".
#
# Default: "auto"
#
# color = "auto"

[graph.edges.chars]
# Single-cell replacements for jj's box-drawing graph chars. Defaults are
# Unicode 16 Large Type Pieces (U+1CE1A..U+1CE50): 𜸟 𜸩 𜸚 𜸤 𜸾 𜹃 𜸨 𜸶 𜸠 𜹀 𜸺.
#
# horizontal   = "𜸟"
# vertical     = "𜸩"
# top-left     = "𜸚"
# top-right    = "𜸤"
# bottom-left  = "𜸾"
# bottom-right = "𜹃"
# tee-right    = "𜸨"
# tee-left     = "𜸶"
# tee-down     = "𜸠"
# tee-up       = "𜹀"
# cross        = "𜸺"
# elision      = "𜹀"

[layout]
# `dash` — glyph repeated to fill the interior cells of a dash run
# between a graph node and the rest of the commit info, and to fill
# elastic_tab pads of two or more cells in the content template.
#
# `dash-start` — opening cap glyph that replaces the first cell of a
# multi-cell dash run (the cell immediately to the right of a graph
# node). Set to "" to disable caps entirely.
#
# `dash-end` — closing cap glyph that replaces the final cell of a
# multi-cell dash run (the cell immediately to the left of the content
# the run terminates against). Together with `dash-start` this produces
# half-line caps on both ends of a run (e.g. `╶─╴`).
#
# Defaults: dash = "─", dash-start = "╶", dash-end = "╴"
#
# dash       = "─"
# dash-start = "╶"
# dash-end   = "╴"

[templates]
# DSL strings controlling per-commit content rendering. Each entry is a
# named template keyed under `templates.<name>`. The jj template must
# include a `bijjou_template_name` field whose value is one of these
# names — bijjou looks the name up and renders the row with the matching
# DSL.
#
# Body grammar: `%{field}` looks up a field from the jj record;
# `%{func(arg)}` is a function call. The only function currently
# supported is `elastic_tab(field)`, which emits the field value
# followed by enough fill cells to reach the batch-wide max width for
# that field (per template) — so the next column's left edge aligns
# across rows.
#
# Real newlines inside a body collapse to single spaces. To embed a
# literal newline in the output, write `\n` (the two-char escape).
#
# Special cases:
#   - An empty body (e.g. `log_oneline = ""`) renders nothing past the
#     graph for rows that name that template — useful when the row's
#     payload is informational only.
#   - If a row names a template that isn't configured, bijjou writes
#     `no bijjou template for <name>` in bright black where the row
#     content would otherwise sit.
#
# Whitespace handling (applied in order per row):
#
#   1. Leading whitespace — any spaces between the start of the
#      template and the first non-whitespace character — is preserved
#      verbatim. It never collapses, even when the first field is
#      empty.
#   2. When a `%{}` block emits an empty string, every whitespace cell
#      between that block and the first non-whitespace character to
#      its left is removed (rule 2 is strictly left-side). This lets
#      empty fields like `%{bookmarks}` disappear without leaving
#      stray gaps. Rule 1 wins when there's no anchor to the left.
#   3. After rules 1-2 and the elastic_tab column alignment have been
#      applied, any run of consecutive whitespace cells is filled with
#      dashes — single cells stay as a literal space; runs of two or
#      more cells become a capped dash run (see [layout]). The graph→
#      content gap participates in this fill alongside the template's
#      own whitespace, so a narrow graph prefix is dashed up to the
#      first field's left edge.
#   4. Whitespace that came out of a `%{}` block — i.e. spaces inside a
#      field value like a commit description — is never modified.
#
# Default:
#
# log_oneline = ''' %{elastic_tab(change_id)} %{elastic_tab(commit_id)} %{elastic_tab(author)} %{elastic_tab(timestamp)} %{working_copies} %{bookmarks} %{tags} %{description}'''

[colors]
# `dash-filler` / `edge`: integer 0-255 (256-color palette) or "#rrggbb"
#   hex string. Defaults: dash-filler = 8 (bright black), edge = 8 (bright black).
#
# dash-filler — color of the internal dash filler between graph chars.
# edge        — color of graph edges (lines, corners, tees, crosses).
#
# dash-filler  = 8
# edge         = 8

[stream]
# Streaming mode flushes rendered output as input arrives, in batches of
# `batch-size` lines. `batch-size` controls flush cadence: smaller batches
# give lower latency to first paint, larger batches reduce syscalls. When
# stdout is a terminal and $PAGER is set, batches are flushed into the
# pager (the pager must tolerate partial input — modern `less` does).
#
# When `activate = "auto"` and streaming is on, the activation-marker scan
# is limited to the first batch. If the marker isn't there, the rest of
# stdin is passed through byte-for-byte without further processing. Set
# `activate = "always"` to skip the scan entirely.
#
# `batch-size` accepts a positive integer or the string "half-pager", which
# sizes the first batch to (terminal_rows - 1) and each subsequent batch to
# floor((terminal_rows - 1) / 2) — useful with a pager so the first paint
# fills a screen and follow-up batches stream in half-screens. Falls back to
# the default integer when no terminal size is detectable.
#
# Defaults: enabled = true, batch-size = 128
#
# enabled    = true
# batch-size = 128
# batch-size = "half-pager"
