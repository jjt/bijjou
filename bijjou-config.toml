# Example bijjou config.
#
# Path resolution:
#   1. $BIJJOU_CONFIG, if set
#   2. $XDG_CONFIG_HOME/bijjou/config.toml
#   3. $HOME/.config/bijjou/config.toml
#
# Every key is optional. Omitted keys keep their built-in default.
# Sections may be omitted entirely. Comments must start in column 0
# (inline `# ...` after a value is not supported).
#
# Overrides (low → high precedence): config file < env vars < CLI flags.
#   Env: prefix `BIJJOU__`, replace `.` with `__` and `-` with `_`.
#     Uppercase is canonical; lowercase also accepted.
#     e.g. `graph.edges.chars.horizontal` → `BIJJOU__GRAPH__EDGES__CHARS__HORIZONTAL`
#   CLI: `--<key>=<value>`, replace `.` with `__`.
#     e.g. `--graph__edges__chars__horizontal=X`
#   `--activate` with no value is shorthand for `--activate=auto`.

# Processing mode: one of "auto", "always", "never".
#   auto   — process only if the `bijjou_template_name` field appears in the
#            input; otherwise pass stdin through byte-for-byte.
#   always — process every line regardless (default).
#   never  — passthrough stdin byte-for-byte without processing.
# The `--activate=<auto|always|never>` CLI flag overrides this; `--activate`
# with no value resolves to "auto".
#
# Default: "always"
#
# activate = "always"

# Pager mode: one of "auto", "always", "never".
#   auto   — page only when $PAGER is set and stdout is a terminal (default).
#   always — always page; bijjou errors at startup if $PAGER is unset.
#   never  — never page; output goes straight to stdout.
#
# Default: "auto"
#
# pager = "auto"

[ui]
# Color output: one of "auto", "always", "never".
#   auto   — emit color when stdout is a terminal; strip otherwise (default).
#   always — always emit color sequences.
#   never  — strip every SGR sequence from the output.
# The `--color=<auto|always|never>` CLI flag overrides this; `--color` with no
# value resolves to "auto".
#
# Default: "auto"
#
# color = "auto"

[graph]
# Collapse the graph's inter-column space.
#
# jj draws the graph in fixed two-cell columns: the glyph (`│`, `├`, a node,
# …) in the first cell, an inter-column gap in the second — a space, or a
# horizontal when a connector runs through it. With `collapse = true` those
# gap cells are dropped, so column N sits at cell N instead of cell 2N and
# the whole graph is half as wide. The graph→content gap (and therefore the
# dash run) shrinks with it.
#
#   collapse = false          collapse = true
#   ○╶───╴rppzwpzx           ○╶─╴rppzwpzx
#   𜸨𜸟𜸠𜸟𜸤                    𜸨𜸠𜸤
#   𜸩 𜸩 ○ vxqsrzyn           𜸩𜸩○ vxqsrzyn
#   𜸩 ○╶𜸩╴mzpomyto           𜸩○𜸩╴mzpomyto
#
# Only gap cells go. A glyph that happens to be a horizontal because a
# connector spans several columns (`├───╯`) keeps its own cell, and an
# inactive column keeps one of its two spaces — otherwise the glyphs to the
# right would slide off the columns above and below them.
#
# Default: false
#
# collapse = false

[graph.edges.chars]
# Single-cell replacements for jj's box-drawing graph chars. Defaults are
# Unicode 16 Large Type Pieces (U+1CE1A..U+1CE50): 𜸟 𜸩 𜸚 𜸤 𜸾 𜹃 𜸨 𜸶 𜸠 𜹀 𜸺.
#
# horizontal   = "𜸟"
# vertical     = "𜸩"
# top-left     = "𜸚"
# top-right    = "𜸤"
# bottom-left  = "𜸾"
# bottom-right = "𜹃"
# tee-right    = "𜸨"
# tee-left     = "𜸶"
# tee-down     = "𜸠"
# tee-up       = "𜹀"
# cross        = "𜸺"
# elision      = "𜹀"

[layout]
# `dash` — glyph repeated to fill the interior cells of a dash run
# between a graph node and the rest of the commit info, and to fill
# elastic_tab pads of two or more cells in the content template.
#
# `dash-start` — opening cap glyph that replaces the first cell of a
# multi-cell dash run (the cell immediately to the right of a graph
# node). Set to "" to drop the cap; the cell becomes a plain `dash`.
#
# `dash-end` — glyph for the closing cell of a dash run, the cell
# immediately to the left of the content the run terminates against.
# That cell is never a dash: when `dash-end` is "" (the default) it is a
# plain space, so the change id always has a space to its left:
#
#   ○╶───── qquxkvlu bade4917 …     dash-end = ""   (default)
#   ○╶────╴qquxkvlu bade4917 …      dash-end = "╴"
#
# A one-cell run is nothing but its closing cell, so it follows the same
# rule (`●╶𜸩 vqyvkx` vs `●╶𜸩╴vqyvkx`).
#
# Defaults: dash = "─", dash-start = "╶", dash-end = ""
#
# dash       = "─"
# dash-start = "╶"
# dash-end   = ""

[colors]
# Either an integer 0-255 (256-color palette) or a "#rrggbb" hex string.
# Defaults: dash-filler = 8 (bright black), graph-edge = 8 (bright black).
#
# dash-filler — color of the dash filler between graph and content.
# graph-edge  — color of graph edges (lines, corners, tees, crosses).
#
# dash-filler  = 8
# graph-edge   = 8

[hydra]
# A jj hydra merges several linear stacks as siblings off one base, so
# `jj log` gives each stack its own graph column. With `enable = true` bijjou
# marks those columns up, recognizing them by the bookmark names under
# `[hydra.prefixes]` below: a row carrying `HYS-<name>` opens that stack, the
# anchors (`HYB` / `HYH` / `HYCR`) and the `HYWC-*` working copies close it.
# A repo with no hydra carries none of those bookmarks, so it gets no markup
# — the output is byte-for-byte what it is with `enable = false`.
#
# A stack also ends where its graph column does: the rows under a marker are
# its content only while their node stays in the marker's column, so an extra
# head off the base — drawn below the bottom stack, above `HYB` — is nobody's
# stack and keeps jj's own colours.
#
# Classification is per row, off the `bookmarks` field and the graph prefix jj
# already drew: no subprocess, no repo lookup, nothing to wait on.
#
# Markup assumes jj's default top-down log order. `jj log --reversed` puts a
# stack's commits above its marker, which the walk cannot follow.
#
# Default: true
#
# enable = true

# jj closes a graph column only when the branch to its *left* ends, so every
# stack gets a `├─╯` row under it except the topmost, which runs straight
# into its neighbour. `top-stack-padding = true` draws the separator jj
# skipped: the next stack's own columns, all verticals.
#
#   top-stack-padding = false     top-stack-padding = true
#   𜸩𜸩𜸩● knktkz                   𜸩𜸩𜸩● knktkz
#   𜸩𜸩●𜸩 zolnlk HYS-list-prs      𜸩𜸩𜸩𜸩
#   𜸩𜸩●𜸩 kknmqn                   𜸩𜸩●𜸩 zolnlk HYS-list-prs
#   𜸩𜸩𜸨𜹃                          𜸩𜸩●𜸩 kknmqn
#                                 𜸩𜸩𜸨𜹃
#
# Default: true
#
# top-stack-padding = true

# Colour each stack's graph nodes, so a column is readable at a glance.
#   true   — hash the stack's name into a colour (stable across runs, and a
#            stack keeps its colour as the log reorders). The hash picks a
#            hue at fixed saturation and lightness, out of the circle less
#            two reserved bands: 10° either side of `#a6e3a1` (115°) and of
#            `#f5c2e7` (316°), so a stack never reads as those. An explicit
#            palette is yours, so it is used as given.
#   false  — leave every node exactly as jj drew it.
#   list   — an explicit palette, indexed by the order the log first names
#            each stack: the first stack named takes the first entry, the
#            next one the second, wrapping when there are more stacks than
#            colours. Working-copy rows sit above the stacks, so they are
#            what sets that order. Entries are `int 0-255 | "#rrggbb"`, same
#            as `[colors]`. Over env or CLI, spell the list comma-separated:
#            `--hydra__colors=1,2,"#aabbcc"`.
#
# A stack's `HYWC-<name>` working copy takes the same colour as the stack,
# so the two read as one thing even though the working copy sits outside the
# stack. The anchors (`HYB` / `HYH` / `HYCR`) and anything outside the hydra
# keep jj's colours.
#
# Default: true
#
# colors = true

# Print the hydra bookmark names in their stack's colour as well: `HYS-foo`
# on the marker row and `HYWC-foo` on the working copy both read in the same
# colour as the column they belong to. jj's own colour is replaced for those
# names only; every other bookmark on the row, and the anchors
# (`HYB` / `HYH` / `HYCR`), keep the colours jj gave them. With
# `colors = false` there is no stack colour to use, so this does nothing.
#
# Default: true
#
# color-bookmarks = true

[hydra.prefixes]
# How this repo names its hydra bookmarks — the same naming
# `hydra status --toml` reports under `bookmarks.*`, spelled here so bijjou
# never has to ask. Change these only if the repo changed its own naming; a
# mismatch means no markup, never wrong markup.
#
# `prefix` leads every hydra bookmark. `base`, `head` and
# `conflict-resolution` complete a whole bookmark name (`HYB`, `HYH`,
# `HYCR`). `stack-head` and `stack-working-copy` are followed by
# `-<stack name>` (`HYS-foo`, `HYWC-foo`).
#
# Defaults: prefix = "HY", base = "B", head = "H",
#           conflict-resolution = "CR", stack-head = "S",
#           stack-working-copy = "WC"
#
# prefix              = "HY"
# base                = "B"
# head                = "H"
# conflict-resolution = "CR"
# stack-head          = "S"
# stack-working-copy  = "WC"

[hydra.prefixes-replace]
# What those names read as once rendered, keyed exactly like
# `[hydra.prefixes]` above. Classification is untouched: the bookmarks are
# still matched under their real names, only printed under these.
#
# A key that is set stands in for the whole leader `[hydra.prefixes]` builds
# out of it, and the stack name behind that leader is kept:
#
#   base = "◆"         →  `HYB` renders `◆`
#   stack-head = "Ψ"   →  `HYS-foo` renders `Ψfoo`
#
# The dash belongs to the leader, so `stack-head` and `stack-working-copy`
# take it with them. `prefix` replaces the shared `HY` leader only —
# `prefix = "Ψ"` renders `HYS-foo` as `ΨS-foo` and `HYB` as `ΨB` — and a
# per-bookmark key wins over it. A key left unset leaves the bookmarks it
# names exactly as jj printed them, so replacing one leader is not replacing
# the rest.
#
# A stand-in is not the width of the name it replaces; the elastic-tab
# columns are measured on what is rendered, so they line up either way.
#
# Defaults: every key unset — each name renders as itself.
#
# prefix              = "⋔"
# base                = "◆"
# head                = "H"
# conflict-resolution = "CR"
# stack-head          = "Ψ"
# stack-working-copy  = "ψ"

[stream]
# Streaming mode flushes rendered output as input arrives, in batches of
# `batch-size` lines. The graph-column width is tracked across the whole
# stream and grows monotonically the moment a wider graph column appears
# (not at the batch boundary), so column alignment never shifts backwards.
# `batch-size` controls flush cadence: smaller batches give lower latency to
# first paint, larger batches reduce syscalls. When stdout is a terminal and
# $PAGER is set, batches are flushed into the pager (the pager must tolerate
# partial input — modern `less` does).
#
# Note: streaming and non-streaming intentionally differ here. Non-streaming
# has the whole input up front and aligns every line to the global max
# graph_col, so early narrow rows get dash filler that extends to the widest
# point of the log. Streaming pre-scans the first batch so every line in it
# shares the batch-wide max; subsequent batches widen monotonically per-line
# as wider rows arrive (and never shrink). Same input → different output
# between the two modes for any log that fans out after the first batch.
#
# When `activate = "auto"` and streaming is on, the scan for the
# `bijjou_template_name` field is limited to the first batch. If it isn't
# there, the rest of stdin is passed through byte-for-byte without further
# processing. Set `activate = "always"` to skip the scan entirely.
#
# `batch-size` accepts a positive integer or the string "half-pager", which
# sizes the first batch to (terminal_rows - 1) and each subsequent batch to
# floor((terminal_rows - 1) / 2) — useful with a pager so the first paint
# fills a screen and follow-up batches stream in half-screens. Falls back to
# the default integer when no terminal size is detectable.
#
# Defaults: enabled = true, batch-size = 128
#
# enabled    = true
# batch-size = 128
batch-size = "half-pager"

[templates]
log_oneline = ''' %{elastic_tab(change_id)} %{elastic_tab(commit_id)} %{elastic_tab(author)} %{elastic_tab(timestamp)} %{working_copies} %{bookmarks} %{tags} %{description}'''
