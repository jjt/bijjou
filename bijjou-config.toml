# Example bijjou config.
#
# Path resolution:
#   1. $BIJJOU_CONFIG, if set
#   2. $XDG_CONFIG_HOME/bijjou/config.toml
#   3. $HOME/.config/bijjou/config.toml
#
# Every key is optional. Omitted keys keep their built-in default.
# Sections may be omitted entirely. Comments must start in column 0
# (inline `# ...` after a value is not supported).
#
# Overrides (low → high precedence): config file < env vars < CLI flags.
#   Env: prefix `BIJJOU__`, replace `.` with `__` and `-` with `_`.
#     Uppercase is canonical; lowercase also accepted.
#     e.g. `graph.edges.chars.horizontal` → `BIJJOU__GRAPH__EDGES__CHARS__HORIZONTAL`
#   CLI: `--<key>=<value>`, replace `.` with `__`.
#     e.g. `--graph__edges__chars__horizontal=X`
#   `--activate` with no value is shorthand for `--activate=auto`.

# Processing mode: one of "auto", "always", "never".
#   auto   — process only if the `bijjou_template_name` field appears in the
#            input; otherwise pass stdin through byte-for-byte.
#   always — process every line regardless (default).
#   never  — passthrough stdin byte-for-byte without processing.
# The `--activate=<auto|always|never>` CLI flag overrides this; `--activate`
# with no value resolves to "auto".
#
# Default: "always"
#
# activate = "always"

# Pager mode: one of "auto", "always", "never".
#   auto   — page only when $PAGER is set and stdout is a terminal (default).
#   always — always page; bijjou errors at startup if $PAGER is unset.
#   never  — never page; output goes straight to stdout.
#
# Default: "auto"
#
# pager = "auto"

[ui]
# Color output: one of "auto", "always", "never".
#   auto   — emit color when stdout is a terminal; strip otherwise (default).
#   always — always emit color sequences.
#   never  — strip every SGR sequence from the output.
# The `--color=<auto|always|never>` CLI flag overrides this; `--color` with no
# value resolves to "auto".
#
# Default: "auto"
#
# color = "auto"

[graph.edges.chars]
# Single-cell replacements for jj's box-drawing graph chars. Defaults are
# Unicode 16 Large Type Pieces (U+1CE1A..U+1CE50): 𜸟 𜸩 𜸚 𜸤 𜸾 𜹃 𜸨 𜸶 𜸠 𜹀 𜸺.
#
# horizontal   = "𜸟"
# vertical     = "𜸩"
# top-left     = "𜸚"
# top-right    = "𜸤"
# bottom-left  = "𜸾"
# bottom-right = "𜹃"
# tee-right    = "𜸨"
# tee-left     = "𜸶"
# tee-down     = "𜸠"
# tee-up       = "𜹀"
# cross        = "𜸺"
# elision      = "𜹀"

[layout]
# `dash` — glyph repeated to fill the interior cells of a dash run
# between a graph node and the rest of the commit info, and to fill
# elastic_tab pads of two or more cells in the content template.
#
# `dash-start` — opening cap glyph that replaces the first cell of a
# multi-cell dash run (the cell immediately to the right of a graph
# node). Set to "" to disable caps entirely.
#
# `dash-end` — closing cap glyph that replaces the final cell of a
# multi-cell dash run (the cell immediately to the left of the content
# the run terminates against). Together with `dash-start` this produces
# half-line caps on both ends of a run (e.g. `╶─╴`).
#
# Defaults: dash = "─", dash-start = "╶", dash-end = "╴"
#
# dash       = "─"
# dash-start = "╶"
# dash-end   = "╴"

[colors]
# Either an integer 0-255 (256-color palette) or a "#rrggbb" hex string.
# Defaults: dash-filler = 8 (bright black), graph-edge = 8 (bright black).
#
# dash-filler — color of the dash filler between graph and content.
# graph-edge  — color of graph edges (lines, corners, tees, crosses).
#
# dash-filler  = 8
# graph-edge   = 8

[stream]
# Streaming mode flushes rendered output as input arrives, in batches of
# `batch-size` lines. The graph-column width is tracked across the whole
# stream and grows monotonically the moment a wider graph column appears
# (not at the batch boundary), so column alignment never shifts backwards.
# `batch-size` controls flush cadence: smaller batches give lower latency to
# first paint, larger batches reduce syscalls. When stdout is a terminal and
# $PAGER is set, batches are flushed into the pager (the pager must tolerate
# partial input — modern `less` does).
#
# Note: streaming and non-streaming intentionally differ here. Non-streaming
# has the whole input up front and aligns every line to the global max
# graph_col, so early narrow rows get dash filler that extends to the widest
# point of the log. Streaming pre-scans the first batch so every line in it
# shares the batch-wide max; subsequent batches widen monotonically per-line
# as wider rows arrive (and never shrink). Same input → different output
# between the two modes for any log that fans out after the first batch.
#
# When `activate = "auto"` and streaming is on, the scan for the
# `bijjou_template_name` field is limited to the first batch. If it isn't
# there, the rest of stdin is passed through byte-for-byte without further
# processing. Set `activate = "always"` to skip the scan entirely.
#
# `batch-size` accepts a positive integer or the string "half-pager", which
# sizes the first batch to (terminal_rows - 1) and each subsequent batch to
# floor((terminal_rows - 1) / 2) — useful with a pager so the first paint
# fills a screen and follow-up batches stream in half-screens. Falls back to
# the default integer when no terminal size is detectable.
#
# Defaults: enabled = true, batch-size = 128
#
# enabled    = true
# batch-size = 128
batch-size = "half-pager"

[templates]
log_oneline = ''' %{elastic_tab(change_id)} %{elastic_tab(commit_id)} %{elastic_tab(author)} %{elastic_tab(timestamp)} %{working_copies} %{bookmarks} %{tags} %{description}'''
diff_numstat = ''' %{lines_added} %{lines_removed} %{elastic_tab(status_char)} %{path}'''
